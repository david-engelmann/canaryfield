[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canaryfield"
version = "0.1.0"
description = "It plants real seeded defects into a codebase on a schedule and keeps score of which gates catch each one and which wave it through."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["canaryfield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
