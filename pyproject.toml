[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "canaryfield"
version = "0.1.0"
description = "Plant seeded defects into scratch copies of a codebase and score which gates catch each one."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

[tool.setuptools.packages.find]
include = ["canaryfield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
