name: ci

on:
  push:
  pull_request:
  merge_group:

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Rust port
        run: cargo build
      - name: Run the Rust port tests
        run: |
          set -o pipefail
          cargo test 2>&1 | sed -n -e 's/^\(test .* FAILED\)$/::error::\1/p' -e 's/^\(failures:\)$/::error::\1/p' -e 's/^    \([a-z_0-9]*\)$/::error::failing test \1/p'
      - name: Check the formatting
        run: cargo fmt --check
      - name: Run the linter
        run: cargo clippy --offline --all-targets
