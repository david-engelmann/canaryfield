name: ci

on:
  push:
  pull_request:
  merge_group:

jobs:
  cargo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the Rust port
        run: cargo build
      - name: Run the Rust port tests
        run: cargo test
      - name: Check the formatting
        run: cargo fmt --check
      - name: Run the linter
        run: cargo clippy --offline --all-targets
