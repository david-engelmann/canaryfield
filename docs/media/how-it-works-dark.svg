<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 408" width="960" height="408" role="img" aria-label="How canaryfield works">
  <title>How canaryfield works from input ingestion to deterministic verification verdict</title>
  <rect width="960" height="408" rx="20" fill="#181715" stroke="#35322d" stroke-width="1.5"/>
  <text x="30" y="42" fill="#fbbf24" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="11.5" font-weight="700" letter-spacing="1.2">ARCHITECTURE PIPELINE  /  CANARYFIELD</text>
  <text x="30" y="72" fill="#f5f2eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="750">Does the harness catch planted defects?  <tspan fill="#a8a29e" font-size="15.5" font-weight="450">End-to-end gate scoring across 200+ registered Python defect classes in scratch copies or branches.</tspan></text>
  
  <rect x="28" y="104" width="214" height="228" rx="14" fill="#211f1c" stroke="#35322d" stroke-width="1.5"/>
  <rect x="46" y="122" width="42" height="26" rx="8" fill="#2b2310" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="67" y="139.5" text-anchor="middle" fill="#fbbf24" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">01</text>
  <text x="46" y="176" fill="#f5f2eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">SEED PACK REGISTRY</text>
  <line x1="46" y1="190" x2="224" y2="190" stroke="#35322d" stroke-width="1"/>
  <text x="46" y="216" fill="#a8a29e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="46" dy="0">Prefix-pinned defect</tspan><tspan x="46" dy="19">catalogue spanning</tspan><tspan x="46" dy="19">versioned</tspan><tspan x="46" dy="19">canaryfield-seeds packs</tspan><tspan x="46" dy="19">(204 seeds at v0.46)</tspan></text><path d="M245 218 H255 M251 214 L255 218 L251 222" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="258" y="104" width="214" height="228" rx="14" fill="#211f1c" stroke="#35322d" stroke-width="1.5"/>
  <rect x="276" y="122" width="42" height="26" rx="8" fill="#2b2310" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="297" y="139.5" text-anchor="middle" fill="#fbbf24" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">02</text>
  <text x="276" y="176" fill="#f5f2eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">SCRATCH PLANTING</text>
  <line x1="276" y1="190" x2="454" y2="190" stroke="#35322d" stroke-width="1"/>
  <text x="276" y="216" fill="#a8a29e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="276" dy="0">Plants every matching AST</tspan><tspan x="276" dy="19">site into isolated copies</tspan><tspan x="276" dy="19">or throwaway git branches</tspan></text><path d="M475 218 H485 M481 214 L485 218 L481 222" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="488" y="104" width="214" height="228" rx="14" fill="#211f1c" stroke="#35322d" stroke-width="1.5"/>
  <rect x="506" y="122" width="42" height="26" rx="8" fill="#2b2310" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="527" y="139.5" text-anchor="middle" fill="#fbbf24" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">03</text>
  <text x="506" y="176" fill="#f5f2eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">MULTI-GATE RUNNER</text>
  <line x1="506" y1="190" x2="684" y2="190" stroke="#35322d" stroke-width="1"/>
  <text x="506" y="216" fill="#a8a29e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="506" dy="0">Executes tests, linters,</tspan><tspan x="506" dy="19">typecheckers, and review</tspan><tspan x="506" dy="19">hooks with bounded</tspan><tspan x="506" dy="19">timeouts</tspan></text><path d="M705 218 H715 M711 214 L715 218 L711 222" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="718" y="104" width="214" height="228" rx="14" fill="#211f1c" stroke="#35322d" stroke-width="1.5"/>
  <rect x="736" y="122" width="42" height="26" rx="8" fill="#2b2310" stroke="#fbbf24" stroke-width="1.2"/>
  <text x="757" y="139.5" text-anchor="middle" fill="#fbbf24" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="12" font-weight="700">04</text>
  <text x="736" y="176" fill="#f5f2eb" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="750" letter-spacing="0.4">CATCH MATRIX</text>
  <line x1="736" y1="190" x2="914" y2="190" stroke="#35322d" stroke-width="1"/>
  <text x="736" y="216" fill="#a8a29e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13"><tspan x="736" dy="0">Scores caught,</tspan><tspan x="736" dy="19">waved-through,</tspan><tspan x="736" dy="19">not-applicable, and</tspan><tspan x="736" dy="19">gate-broken with zero</tspan><tspan x="736" dy="19">target mutation</tspan></text>
  <rect x="28" y="350" width="904" height="38" rx="10" fill="#1f1d1a" stroke="#35322d" stroke-width="1"/>
  <circle cx="48" cy="369" r="4.5" fill="#22c55e"/>
  <text x="62" y="373.5" fill="#a8a29e" font-family="'SFMono-Regular', ui-monospace, Menlo, Consolas, monospace" font-size="11.5">Target tree stays 100% untouched  |  49 backward-compatible seed pack versions  |  Exposes multi-gate blind spots</text>
</svg>
